<h1>mail-sync</h1>
<p>mail-sync is a private, single-user tool. It copies new messages from the owner's own IMAP
mailbox into the owner's own Gmail inbox using the Gmail API (<code>gmail.insert</code> scope).</p>
<p>It is not offered to the public. Only the owner signs in, and no one else's data is accessed.</p>
